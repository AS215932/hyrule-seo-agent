name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # This public, secret-free job uses GitHub-hosted egress so dependency
    # bootstrap is not coupled to the public PR runner's intermittent PyPI path.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: |
          if [ ! -x "$HOME/.local/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync deps
        env:
          # The public PR runner occasionally sees short PyPI connect stalls.
          # Keep dependency bootstrap bounded but resilient enough to ride
          # them out.
          UV_HTTP_CONNECT_TIMEOUT: "60"
          UV_HTTP_RETRIES: "10"
        run: ~/.local/bin/uv sync --frozen --group dev

      - name: Ruff
        run: ~/.local/bin/uv run ruff check .

      - name: Mypy
        run: ~/.local/bin/uv run mypy app

      - name: Pytest + 90% line+branch coverage gate
        run: |
          ~/.local/bin/uv run python -m pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-branch \
            --cov-fail-under=90

      - name: Docker image builds
        run: docker build -t seo-agent-ci:${{ github.sha }} .
