[project]
name = "seo-agent"
version = "0.1.0"
description = "AS215932 autonomous SEO agent (GSC/PSI/crawl/Umami collectors → deterministic audit → LLM-drafted human-reviewed PRs against hyrule-web)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pydantic-ai-slim[openai]>=1.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "prometheus-client>=0.25.0",
    "aiosqlite>=0.20",
    "google-auth>=2.35",
    "pyjwt[crypto]>=2.9",
    "agent-core",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
seo-agent = "app.main:main"
seoctl = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401", "RUF012"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.uv.sources]
agent-core = { git = "https://github.com/AS215932/agent-core", tag = "v0.8.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING:",
]
