# Model policy for advisory visibility prioritization. Deterministic code owns
# proposals, approval risk, and execution; model output cannot mutate state.
# Ids follow the house "provider:model" convention (see noc-agent).
[model]
primary = "openrouter:z-ai/glm-5.2"
# A failed analysis falls back to deterministic severity/channel ordering.
fallbacks = ["openrouter:deepseek/deepseek-v4-flash"]

[providers.openrouter]
api_key_env = "SEO_AGENT_OPENROUTER_API_KEY"
app_title = "Hyrule Beacon SEO Agent"
