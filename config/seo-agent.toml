# Model policy for the drafting step (the only LLM call in the agent).
# Ids follow the house "provider:model" convention (see noc-agent).
[model]
primary = "openrouter:z-ai/glm-5.2"
# Fallbacks are not wired in v1 — a failed draft simply waits for the next
# weekly cycle; nothing downstream depends on the draft succeeding.
fallbacks = ["openrouter:deepseek/deepseek-v4-flash"]

[providers.openrouter]
api_key_env = "SEO_AGENT_OPENROUTER_API_KEY"
app_title = "AS215932 SEO Agent"
